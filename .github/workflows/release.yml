name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  base:
    name: Publish jsdev
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    outputs:
      version: ${{ steps.settings.outputs.version }}
      major_minor: ${{ steps.settings.outputs.major_minor }}
      stable: ${{ steps.settings.outputs.stable }}
      revision: ${{ steps.settings.outputs.revision }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve build settings
        id: settings
        run: |
          tag="${RELEASE_TAG}"
          version="${tag#v}"
          major_minor="${version%.*}"
          stable=1
          if [[ "${tag}" == *-* ]]; then
            stable=0
          fi
          dockerfile_version="$(sed -n 's/^ARG JSDEV_VERSION=//p' Dockerfile | head -1)"
          if [[ "${version}" != "${dockerfile_version}" ]]; then
            echo "Tag ${tag} does not match JSDEV_VERSION=${dockerfile_version}" >&2
            exit 1
          fi
          revision="$(git rev-parse HEAD)"
          {
            echo "version=${version}"
            echo "major_minor=${major_minor}"
            echo "stable=${stable}"
            echo "revision=${revision}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for GHCR
        id: meta-ghcr
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/jsdev
          tags: |
            type=raw,value=${{ steps.settings.outputs.version }}
            type=raw,value=${{ steps.settings.outputs.major_minor }}
            type=raw,value=node24
            type=raw,value=latest,enable=${{ steps.settings.outputs.stable == '1' }}

      - name: Publish to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            JSDEV_VERSION=${{ steps.settings.outputs.version }}
            JSDEV_IMAGE_REVISION=${{ steps.settings.outputs.revision }}
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: |
            ${{ steps.meta-ghcr.outputs.labels }}
            org.opencontainers.image.revision=${{ steps.settings.outputs.revision }}
          cache-from: type=gha,scope=jsdev
          cache-to: type=gha,mode=max,scope=jsdev

      # GHCR is published before the Docker Hub login so that a Docker Hub
      # credential problem cannot block the GHCR release.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker Hub
        id: meta-dockerhub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/jsdev
          tags: |
            type=raw,value=${{ steps.settings.outputs.version }}
            type=raw,value=${{ steps.settings.outputs.major_minor }}
            type=raw,value=node24
            type=raw,value=latest,enable=${{ steps.settings.outputs.stable == '1' }}

      - name: Publish to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            JSDEV_VERSION=${{ steps.settings.outputs.version }}
            JSDEV_IMAGE_REVISION=${{ steps.settings.outputs.revision }}
          tags: ${{ steps.meta-dockerhub.outputs.tags }}
          labels: |
            ${{ steps.meta-dockerhub.outputs.labels }}
            org.opencontainers.image.revision=${{ steps.settings.outputs.revision }}
          cache-from: type=gha,scope=jsdev

  docker:
    name: Publish jsdev-docker
    needs: base
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    environment: release
    env:
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      JSDEV_VERSION: ${{ needs.base.outputs.version }}
      JSDEV_MAJOR_MINOR: ${{ needs.base.outputs.major_minor }}
      JSDEV_STABLE: ${{ needs.base.outputs.stable }}
      JSDEV_REVISION: ${{ needs.base.outputs.revision }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for GHCR
        id: meta-ghcr
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/jsdev-docker
          tags: |
            type=raw,value=${{ env.JSDEV_VERSION }}
            type=raw,value=${{ env.JSDEV_MAJOR_MINOR }}
            type=raw,value=node24
            type=raw,value=latest,enable=${{ env.JSDEV_STABLE == '1' }}

      - name: Publish to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: with-docker.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            JSDEV_BASE=ghcr.io/${{ github.repository_owner }}/jsdev:${{ env.JSDEV_VERSION }}
            JSDEV_IMAGE_REVISION=${{ env.JSDEV_REVISION }}
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: |
            ${{ steps.meta-ghcr.outputs.labels }}
            org.opencontainers.image.revision=${{ env.JSDEV_REVISION }}
          cache-from: type=gha,scope=jsdev-docker

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker Hub
        id: meta-dockerhub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/jsdev-docker
          tags: |
            type=raw,value=${{ env.JSDEV_VERSION }}
            type=raw,value=${{ env.JSDEV_MAJOR_MINOR }}
            type=raw,value=node24
            type=raw,value=latest,enable=${{ env.JSDEV_STABLE == '1' }}

      - name: Publish to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: with-docker.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            JSDEV_BASE=ghcr.io/${{ github.repository_owner }}/jsdev:${{ env.JSDEV_VERSION }}
            JSDEV_IMAGE_REVISION=${{ env.JSDEV_REVISION }}
          tags: ${{ steps.meta-dockerhub.outputs.tags }}
          labels: |
            ${{ steps.meta-dockerhub.outputs.labels }}
            org.opencontainers.image.revision=${{ env.JSDEV_REVISION }}
          cache-from: type=gha,scope=jsdev-docker
